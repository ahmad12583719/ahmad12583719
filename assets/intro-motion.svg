<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Ahmad Raza introduction</title>
  <desc id="desc">Animated words: building, learning, sharing.</desc>
  <rect width="1000" height="190" rx="18" fill="#090B0F"/>
  <rect x="1" y="1" width="998" height="188" rx="17" fill="none" stroke="#2B3439"/>
  <path d="M42 142H958" stroke="#2B3439"/>
  <circle cx="70" cy="54" r="8" fill="#8FE3E8">
    <animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.45;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="63" fill="#B8C4C8" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="5">AHMAD RAZA / PROFILE SIGNAL</text>
  <text x="52" y="125" fill="#F5F7F8" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="1">
    <tspan opacity="1">BUILDING</tspan>
    <animate attributeName="opacity" values="1;0;0;1" dur="7.5s" repeatCount="indefinite"/>
  </text>
  <text x="52" y="125" fill="#F5F7F8" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="1" opacity="0">
    LEARNING
    <animate attributeName="opacity" values="0;1;0;0" dur="7.5s" repeatCount="indefinite"/>
  </text>
  <text x="52" y="125" fill="#F5F7F8" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="1" opacity="0">
    SHARING
    <animate attributeName="opacity" values="0;0;1;0" dur="7.5s" repeatCount="indefinite"/>
  </text>
  <text x="610" y="124" fill="#8FE3E8" font-family="monospace" font-size="22" letter-spacing="2">curiosity → clarity</text>
  <rect x="930" y="113" width="16" height="4" rx="2" fill="#8FE3E8">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
